document.getElementById("recommendForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const selectedGenre = document.getElementById("genre").value;
    const container = document.getElementById("recommendations");

    const results = content.filter(item => item.genre === selectedGenre);

    let html = `
        <h2 class="section-title">Recommendations</h2>
        <div class="card-container">
    `;

    if (results.length === 0) {
        html += "<p>No recommendations found.</p>";
    } else {
        results.forEach(item => {
            html += `
                <div class="card">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="card-content">
                        <h3>${item.title}</h3>
                        <p class="genre">${item.genre}</p>
                        <p class="rating">⭐ ${item.rating}/10</p>
                        <p>${item.description}</p>
                        <p><br>${item.type} • ${item.year}</p>
                    </div>
                </div>
            `;
        });
    }

    html += "</div>";
    container.innerHTML = html;
});
